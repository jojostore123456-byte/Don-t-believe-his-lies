<!DOCTYPE html><html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>...</title>
<style>
body { background:black; color:#0f0; font-family:monospace; text-align:center; padding:40px; }
input { background:black; color:#0f0; border:1px solid #0f0; padding:10px; margin-top:20px; width:320px; text-align:center; }
button { background:black; color:#0f0; border:1px solid #0f0; padding:10px; margin-left:10px; cursor:pointer; }
.level { display:none; }
.active { display:block; }
</style>
</head>
<body><h1>DON'T BELIEVE HIS LIES</h1><div id="level1" class="level active">
<pre>11 15 24 33 15</pre>
<input id="input1" placeholder="...">
<button onclick="check(1,'quando eu era criança')">></button>
</div><div id="level2" class="level">
<pre>•• •••• ••   •• ••</pre>
<input id="input2" placeholder="...">
<button onclick="check(2,'minha mãe era muito ocupada')">></button>
</div><div id="level3" class="level">
<pre>VJKUBKUBCBOGUUCIG</pre>
<input id="input3" placeholder="...">
<button onclick="check(3,'então ela me deixava sozinha em casa')">></button>
</div><div id="level4" class="level">
<pre>13-1-7-9-14-1</pre>
<input id="input4" placeholder="...">
<button onclick="check(4,'eu não gostava nada disso')">></button>
</div><div id="level5" class="level">
<pre>Uifsfmjf</pre>
<input id="input5" placeholder="...">
<button onclick="check(5,'por que eu sempre ficava com fome')">></button>
</div><div id="level6" class="level">
<pre>01001100 01001001 01000101</pre>
<input id="input6" placeholder="...">
<button onclick="check(6,'até ela voltar')">></button>
</div><div id="level7" class="level">
<pre>⠍⠑⠝⠞⠑</pre>
<input id="input7" placeholder="...">
<button onclick="check(7,'e tinha o cara da janela')">></button>
</div><div id="level8" class="level">
<pre>IFBEGRCF</pre>
<input id="input8" placeholder="...">
<button onclick="check(8,'ele me observa')">></button>
</div><div id="level9" class="level">
<pre>7777 2 4 4 6 2</pre>
<input id="input9" placeholder="...">
<button onclick="check(9,'pela janela')">></button>
</div><div id="level10" class="level">
<pre>P@G!N@</pre>
<input id="input10" placeholder="...">
<button onclick="check(10,'e ele se vai toda vez que a mamãe chega')">></button>
</div><div id="level11" class="level">
<pre>ANIGAP</pre>
<input id="input11" placeholder="...">
<button onclick="check(11,'eu não sei a aparência dele')">></button>
</div><div id="level12" class="level">
<pre>50 41 47 49 4E 41</pre>
<input id="input12" placeholder="...">
<button onclick="check(12,'ele não é humano')">></button>
</div><div id="level13" class="level">
<pre>P ⊕ 3</pre>
<input id="input13" placeholder="...">
<button onclick="check(13,'porque chegou um dia que ele matou minha mãe')">></button>
</div><div id="final" class="level">
<h2>...</h2>
<p>agora você viu demais</p>
</div><script>
function check(level, correct){
  const input = document.getElementById('input'+level).value.toLowerCase().trim();
  if(input === correct){
    document.getElementById('level'+level).classList.remove('active');
    const next = document.getElementById('level'+(level+1)) || document.getElementById('final');
    next.classList.add('active');
  }
}
</script></body>
</html>
